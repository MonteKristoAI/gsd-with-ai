<text x="960" y="785">&#8220;Five stakeholders.</text><text x="960" y="801">One skeptic can stall</text><text x="960" y="817">it.&#8221;</text>
<text x="1240" y="785">&#8220;Purchase order</text><text x="1240" y="801">signed, integration</text><text x="1240" y="817">begins&#8221;</text>
<text x="1520" y="785">&#8220;Second panel sold to</text><text x="1520" y="801">the same account in</text><text x="1520" y="817">six months&#8221;</text>
