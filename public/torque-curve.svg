 text-anchor="middle">"Five stakeholders.</text><text x="960" y="801" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#4B5563" text-anchor="middle">One skeptic can stall</text><text x="960" y="817" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#4B5563" text-anchor="middle">it."</text><text x="1240" y="785" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#4B5563" text-anchor="middle">"Purchase order</text><text x="1240" y="801" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#4B5563" text-anchor="middle">signed, integration</text><text x="1240" y="817" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#4B5563" text-anchor="middle">begins"</text><text x="1520" y="785" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#4B5563" text-anchor="middle">"Second panel sold to</text><text x="1520" y="801" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#4B5563" text-anchor="middle">the same account in</text><text x="1520" y="817" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#4B5563" text-anchor="middle">six months"</text><rect x="1200" y="160" width="300" height="90" fill="white" stroke="#E2E8F0" stroke-width="1" rx="4"/><line x1="1215" y1="188" x2="1255" y2="188" stroke="#001F3F" stroke-width="4.5" stroke-linecap="round"/><circle cx="1235" cy="188" r="6" fill="#001F3F"/><text x="1270" y="193" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#001F3F">Torque</text><text x="1340" y="193" font-family="Arial, sans-serif" font-size="14" fill="#1D2433">pulling power</text><line x1="1215" y1="222" x2="1255" y2="222" stroke="#7C8798" stroke-width="4" stroke-linecap="round"/><circle cx="1235" cy="222" r="5" fill="#5B6676"/><text x="1270" y="227" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5B6676">Friction</text><text x="1340" y="227" fon